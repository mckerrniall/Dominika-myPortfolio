
<nav class="navbar">
  <div class="nav-container">

    <!-- Logo -->
    <a class="logo" routerLink="/" (click)="closeMenu()">
      NM
    </a>

    <!-- Mobile hamburger -->
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation menu">

      <span [class.rotate-top]="menuOpen"></span>
      <span [class.hide-middle]="menuOpen"></span>
      <span [class.rotate-bottom]="menuOpen"></span>

    </button>

    <!-- Navigation links -->
    <div class="nav-links" [class.open]="menuOpen">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">
        Home
      </a>

      <a
        routerLink="/history"
        routerLinkActive="active"
        (click)="closeMenu()">
        History
      </a>

      <a
        routerLink="/experience"
        routerLinkActive="active"
        (click)="closeMenu()">
        Experience
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        (click)="closeMenu()">
        Projects
      </a>

      <a
        routerLink="/research"
        routerLinkActive="active"
        (click)="closeMenu()">
        Research
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="active"
        (click)="closeMenu()">
        Contact
      </a>

    </div>

  </div>
</nav>
